{% extends 'base.html' %}

{% block title %}Department Setup - College Attendance{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
  <div class="col-lg-6 col-md-8">
    <div class="card card-white p-4">
      
      <div class="text-center mb-3">
        <h4 class="fw-bold text-dark mb-1">Department Head Teacher Setup</h4>
        <p class="text-muted small">Configure a Head Teacher for unassigned departments</p>
      </div>

      <form action="{{ url_for('setup_post') }}" method="POST">
        <div class="mb-3">
          <label for="dept_code" class="form-label small text-muted">Select Department</label>
          <select class="form-select form-select-sm" id="dept_code" name="dept_code" required>
            {% for dept in departments %}
              <option value="{{ dept.dept_code }}">
                {{ dept.dept_name }} ({{ dept.dept_code }}) - Faculty ID starts at: {{ dept.faculty_start }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label for="head_name" class="form-label small text-muted">Head Teacher Full Name</label>
          <input type="text" class="form-control form-control-sm" id="head_name" name="name" placeholder="e.g. Prof. Alan Turing" required>
        </div>

        <div class="mb-3">
          <label for="head_pass" class="form-label small text-muted">Password (Leave blank to auto-generate)</label>
          <input type="password" class="form-control form-control-sm" id="head_pass" name="password" placeholder="Leave empty for auto-generated 8-char password">
        </div>

        <button type="submit" class="btn btn-dark-min w-100 py-2">
          Register Head Teacher
        </button>
      </form>

      <div class="mt-3 pt-2 border-top text-center">
        <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">
          &larr; Back to Login
        </a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
